defaults:
    subtitle_languages: []
enabled: true
homepage: https://animes.garden
id: garden
kind: bt
limits:
    # 一次搜索 = 标题数 × 页数 个请求，全并发；30/min 的默认节流会把它拖成十几秒
    concurrency: 3
    max_redirects: 3
    # 只看第一页（pageSize=100）。Nagare 的磁力选集改走 /v1/releases（按作品搜一次、本机选集，
    # 固定只取第 1 页）；/v1/candidates 也随之不再翻页，省掉「标题 × 页数」的请求扇出。
    max_pages: 1
    max_response_bytes: 5242880
    requests_per_minute: 120
    timeout_ms: 12000
matching:
    require_episode: true
    # 接口本身已按关键词筛过，返回里大量是繁体写法（幼女戰記）；再用简体关键词做
    # 子串复核会把这些整批丢掉（实测 80 条丢 41 条），所以不复核作品名，只核集号。
    require_subject: false
name: Anime Garden
# Anime Garden（yjl9903/AnimeGarden，AGPL-3.0）是动漫花园等站的聚合镜像，提供开放 JSON 接口；
# 本规则只声明「请求什么、怎么解」，返回的是 infohash 磁力指针。接口给的 magnet 不带 tracker，
# 由 nagare 侧内置的公共 tracker 组补齐。
origin:
    ecosystem: community
    license: AGPL-3.0
    upstream: https://animes.garden
    version: "1"
ranking:
    has_seeders: false
    priority: 0
resolve:
    mode: direct
    transport: torrent
    url: '{{magnet}}'
schema: nagare-source/v1
search:
    fields:
        episode:
            expression: title
            required: false
            transforms:
                - parse_episode
            type: field
        fansub:
            any:
                - expression: $.fansub.name
                  type: jsonpath
                - expression: title
                  transforms:
                    - parse_fansub
                  type: field
            # 接口没给字幕组、标题也不以 [组名] 开头（【】括号或干脆没有组名）的发布也要留下
            required: false
        magnet:
            expression: $.magnet
            type: jsonpath
        provider:
            expression: $.provider
            required: false
            type: jsonpath
        published_at:
            expression: $.createdAt
            required: false
            transforms:
                - type: parse_datetime
                  unit: auto
            type: jsonpath
        size_bytes:
            expression: $.size
            required: false
            # 2026-10-09 实测接口给的是字节（都是 1024 的整数倍，单集 WebRip 5–6 亿），不是 KB
            transforms:
                - type: parse_size
                  unit: B
            type: jsonpath
        title:
            expression: $.title
            type: jsonpath
    items:
        expression: $.resources
        type: jsonpath
    request:
        allowed_hosts:
            - api.animes.garden
        headers:
            Accept: application/json
        method: GET
        timeout_ms: 12000
        url: https://api.animes.garden/resources?search={{title}}&type=%E5%8A%A8%E7%94%BB&pageSize=100&page={{page}}
    response: json
selftest:
    expect:
        min_candidates: 1
        transport: torrent
    request:
        # 不带集号：接口只返回最近 80 条，指定集号会随时间失效
        query: 葬送的芙莉莲
tier: 3
