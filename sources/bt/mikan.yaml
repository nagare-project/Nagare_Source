defaults:
    subtitle_languages: []
enabled: true
homepage: https://mikanani.me
id: mikan
kind: bt
limits:
    concurrency: 3
    max_redirects: 3
    max_response_bytes: 10485760
    requests_per_minute: 120
    timeout_ms: 20000
matching:
    require_episode: true
    # 站点自己已按关键词筛过；标题里常见繁体/别名写法，用请求标题做子串复核会整批丢掉
    require_subject: false
name: Mikan Project
# Mikan Project 网页搜索：RSS 搜索固定只给最新 100 条，网页搜索一次给到 1000 条（约 4 MB）。
# 每行自带完整磁力（含 tracker），标题链接末尾是 infohash；更新时间是不带时区的北京时间「2026/08/28 05:32」。
origin:
    ecosystem: community
    license: AGPL-3.0
    upstream: https://mikanani.me
    version: "1"
ranking:
    has_seeders: false
    priority: 0
resolve:
    mode: direct
    transport: torrent
    url: '{{magnet}}'
schema: nagare-source/v1
search:
    fields:
        episode:
            expression: title
            required: false
            transforms:
                - parse_episode
            type: field
        fansub:
            expression: title
            transforms:
                - parse_fansub
            required: false
            type: field
        magnet:
            any:
                - attribute: data-magnet
                  expression: input.js-episode-select
                  type: css
                - attribute: href
                  expression: a.magnet-link-wrap
                  transforms:
                    - pattern: '[0-9a-fA-F]{40}'
                      type: regex
                    - display_name_from: title
                      trackers:
                        - http://nyaa.tracker.wf:7777/announce
                        - http://tracker.opentrackr.org:1337/announce
                      type: magnet
                  type: css
        published_at:
            expression: td:nth-child(4)
            required: false
            transforms:
                - type: replace
                  pattern: '^([0-9]{4})/([0-9]{2})/([0-9]{2}) ([0-9]{2}:[0-9]{2})$'
                  replacement: '$1-$2-$3 $4:00'
                - type: parse_datetime
                  assume_offset: "+08:00"
            type: css
        size_bytes:
            expression: td:nth-child(3)
            required: false
            transforms:
                - type: parse_size
            type: css
        title:
            expression: a.magnet-link-wrap
            type: css
        torrent_url:
            attribute: href
            expression: a[href$=".torrent"]
            required: false
            transforms:
                - absolute_url
            type: css
    items:
        expression: tr.js-search-results-row
        type: css
    request:
        allowed_hosts:
            - mikanani.me
        method: GET
        timeout_ms: 20000
        url: https://mikanani.me/Home/Search?searchstr={{title}}
    response: html
selftest:
    expect:
        min_candidates: 1
        transport: torrent
    request:
        query: 葬送的芙莉莲
tier: 3
