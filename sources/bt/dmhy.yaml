defaults:
    subtitle_languages: []
enabled: true
homepage: https://share.dmhy.org
id: dmhy
kind: bt
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 30
    timeout_ms: 20000
matching:
    require_episode: true
    # 站点自己已按关键词筛过；标题里常见繁体/别名写法，用请求标题做子串复核会整批丢掉
    require_subject: false
name: 動漫花園
# 動漫花園 RSS：enclosure 就是磁力（自带 tracker 列表），无做种数。
origin:
    ecosystem: community
    license: AGPL-3.0
    upstream: https://share.dmhy.org
    version: "1"
ranking:
    has_seeders: false
    priority: 0
resolve:
    mode: direct
    transport: torrent
    url: '{{magnet}}'
schema: nagare-source/v1
search:
    fields:
        episode:
            expression: title
            required: false
            transforms:
                - parse_episode
            type: field
        fansub:
            expression: title
            transforms:
                - parse_fansub
            required: false
            type: field
        magnet:
            expression: ./enclosure/@url
            type: xpath
        published_at:
            expression: ./pubDate/text()
            required: false
            transforms:
                - type: parse_datetime
                  unit: auto
            type: xpath
        size_bytes:
            expression: ./enclosure/@length
            required: false
            transforms:
                - type: parse_size
                  unit: B
            type: xpath
        title:
            expression: ./title/text()
            type: xpath
    items:
        expression: /rss/channel/item
        type: xpath
    request:
        allowed_hosts:
            - share.dmhy.org
        method: GET
        timeout_ms: 20000
        url: https://share.dmhy.org/topics/rss/rss.xml?keyword={{title}}
    response: xml
selftest:
    expect:
        min_candidates: 1
        transport: torrent
    request:
        query: 葬送的芙莉莲
tier: 3
