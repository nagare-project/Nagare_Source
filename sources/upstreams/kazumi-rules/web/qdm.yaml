defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.qdm8.cc/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //section/div[3]/div/article//div
            type: xpath
    request:
        allowed_hosts:
            - www.qdm8.cc
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.qdm8.cc/
id: qdm
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: qdm
origin:
    digest: sha256:390f5d80f9e38a8613ca4f3b06511f1a1039f4b1c97177ffa64dc1c3f111171f
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/qdm.json
    version: "1.3"
resolve:
    allowed_hosts:
        - www.qdm8.cc
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.qdm8.cc/
    fields:
        subject_key:
            attribute: href
            expression: //a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //a/h2
            transforms:
                - trim
            type: xpath
    items:
        expression: //section/div/div/div/div/div//article
        type: xpath
    request:
        allowed_hosts:
            - www.qdm8.cc
        method: GET
        url: https://www.qdm8.cc/index.php?s=vod-search-name&wd={{title}}
    response: html
tier: 2
