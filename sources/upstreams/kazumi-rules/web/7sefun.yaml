defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: true
episodes:
    base_url: https://www.7sefun.top/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[2]/div[2]/div[2]/div/div[2]/div[1]//div
            type: xpath
    request:
        allowed_hosts:
            - www.7sefun.top
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.7sefun.top/
id: 7sefun
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: 7sefun
origin:
    digest: sha256:2f05d1c1b33bf743ee5ff8e1032f39fee019dbad170315542595a8fb9d0df6d6
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/7sefun.json
    version: "1.3"
resolve:
    allowed_hosts:
        - www.7sefun.top
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.7sefun.top/
    fields:
        subject_key:
            attribute: href
            expression: //a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div[2]/text()
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[2]/div[2]/div[2]/div[2]/div
        type: xpath
    request:
        allowed_hosts:
            - www.7sefun.top
        method: GET
        url: https://www.7sefun.top/vodsearch/-------------.html?wd={{title}}
    response: html
tier: 2
