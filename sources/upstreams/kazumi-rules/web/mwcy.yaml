defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.mwcy.net/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //ul[@class='anthology-list-play size']
            type: xpath
    request:
        allowed_hosts:
            - www.mwcy.net
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.mwcy.net/
id: mwcy
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: mwcy
origin:
    digest: sha256:86418adcbc89cee52b0e05777cf51d29e60f9c184e3222b554aaba153b76f1d7
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/mwcy.json
    version: "1.2"
resolve:
    allowed_hosts:
        - www.mwcy.net
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.mwcy.net/
    fields:
        subject_key:
            attribute: href
            expression: //div/div[2]/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div/div[2]/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div/div[2]/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[@class='vod-detail style-detail cor4 search-list']
        type: xpath
    request:
        allowed_hosts:
            - www.mwcy.net
        method: GET
        url: https://www.mwcy.net/search.html?wd={{title}}
    response: html
tier: 2
