defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.xiaobaotv.app
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[1]/div/div[1]/div[3]/div/div[2]/div/ul
            type: xpath
    request:
        allowed_hosts:
            - www.xiaobaotv.app
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.xiaobaotv.app/
id: xiaobao
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: xiaobao
origin:
    digest: sha256:1066074aaf72c55a7f9bf5d45a83b2b0f3ad67eeda19b6249eb3bd472b0e3801
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/xiaobao.json
    version: 0.0.1
resolve:
    allowed_hosts:
        - www.xiaobaotv.app
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.xiaobaotv.app
    fields:
        subject_key:
            attribute: href
            expression: //div[2]/h4/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div[2]/h4/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div[2]/h4/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[1]/div/div/div[1]/div/div/div[2]/ul/li
        type: xpath
    request:
        allowed_hosts:
            - www.xiaobaotv.app
        method: GET
        url: https://www.xiaobaotv.app/vod/search/-------------.html?wd={{title}}
    response: html
tier: 2
