defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: true
episodes:
    base_url: https://dm1.xfdm.pro/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //ul[@class='anthology-list-play size']
            type: xpath
    request:
        allowed_hosts:
            - dm1.xfdm.pro
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://dm1.xfdm.pro/
id: xfdmneo
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: xfdmneo
origin:
    digest: sha256:a60c3152490147096d0d71f45e1208fe49aa39de24e46f33459701237c672b87
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/xfdmneo.json
    version: "1.1"
resolve:
    allowed_hosts:
        - dm1.xfdm.pro
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://dm1.xfdm.pro/
    fields:
        subject_key:
            attribute: href
            expression: //div[3]/div[2]/a[1]
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div[3]/div[2]/a[1]
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div[3]/div[1]/div[1]
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[@class='public-list-box search-box flex rel']
        type: xpath
    request:
        allowed_hosts:
            - dm1.xfdm.pro
        method: GET
        url: https://dm1.xfdm.pro/search.html?wd={{title}}
    response: html
tier: 2
