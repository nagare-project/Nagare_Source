defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: true
episodes:
    base_url: https://www.agedm.io/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //ul/li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[2]/div/section/div/div[2]/div[2]/div[2]/div
            type: xpath
    request:
        allowed_hosts:
            - www.agedm.io
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.agedm.io/
id: age
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: AGE
origin:
    digest: sha256:fddbf860329911f2941013f0352e8d4ad2adfae4d276f0f5f70329a39241b444
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/AGE.json
    version: "1.5"
resolve:
    allowed_hosts:
        - www.agedm.io
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.agedm.io/
    fields:
        subject_key:
            attribute: href
            expression: //div/div[2]/h5/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div/div[2]/h5/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div/div[2]/h5/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[2]/div/section/div/div/div/div
        type: xpath
    request:
        allowed_hosts:
            - www.agedm.io
        method: GET
        url: https://www.agedm.io/search?query={{title}}
    response: html
tier: 2
