defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://nekodm.com/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[3]/div[6]
            type: xpath
    request:
        allowed_hosts:
            - nekodm.com
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://nekodm.com/
id: nekodm
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: nekodm
origin:
    digest: sha256:f02cbb58213f229a2befe3b2b6495945ed3eb19910ad89418cd5e08f763a1963
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/nekodm.json
    version: "1.2"
resolve:
    allowed_hosts:
        - nekodm.com
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://nekodm.com/
    fields:
        subject_key:
            attribute: href
            expression: //a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //a/p
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[3]/div[1]/div/div/div
        type: xpath
    request:
        allowed_hosts:
            - nekodm.com
        method: GET
        url: https://nekodm.com/search?wd={{title}}
    response: html
tier: 2
