defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.libvio.cc/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[1]/div[2]/div/div/div//div
            type: xpath
    request:
        allowed_hosts:
            - www.libvio.cc
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.libvio.cc/
id: libvio
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: libvio
origin:
    digest: sha256:c859793937d7773af0aa349f2042bcc1b67aa54c0ab15eb779a7719c9582f01d
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/libvio.json
    version: "0.4"
resolve:
    allowed_hosts:
        - www.libvio.cc
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    request_headers:
        Referer: https://www.libvio.site/
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.libvio.cc/
    fields:
        subject_key:
            attribute: href
            expression: //div/div/h4/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div/div/h4/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div/div/h4/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[1]/ul//li
        type: xpath
    request:
        allowed_hosts:
            - www.libvio.cc
        method: GET
        url: https://www.libvio.cc/search/-------------.html?wd={{title}}&submit=
    response: html
tier: 2
