defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://anime7.top/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //ul[@id='hl-plays-list']
            type: xpath
    request:
        allowed_hosts:
            - anime7.top
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://anime7.top/
id: anime7
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: anime7
origin:
    digest: sha256:aed0d192282b8d9cc1bf8f57ed12f860516c6e4863133a5197476ac9f6265ad7
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/anime7.json
    version: "1.0"
resolve:
    allowed_hosts:
        - anime7.top
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://anime7.top/
    fields:
        subject_key:
            attribute: href
            expression: //div/div/div[2]/div[2]/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div/div/div[2]/div[2]/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div/div/div[2]/div[1]/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[2]/div/div[2]/div/div[2]/div[1]/div/div[2]/div/ul//li
        type: xpath
    request:
        allowed_hosts:
            - anime7.top
        method: GET
        url: https://anime7.top/vod-search/?wd={{title}}&submit=
    response: html
tier: 2
