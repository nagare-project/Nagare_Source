defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.gpjda.com/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //ul[@class='stui-content__playlist playlink clearfix']
            type: xpath
    request:
        allowed_hosts:
            - www.gpjda.com
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.gpjda.com/
id: gpjda
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: gpjda
origin:
    digest: sha256:2586e4ce5f97ccb523e35b616b6c1d9f114f378586c5c2710631fd6d3c07d937
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/gpjda.json
    version: "1.0"
resolve:
    allowed_hosts:
        - www.gpjda.com
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.gpjda.com/
    fields:
        subject_key:
            attribute: href
            expression: //h4/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //h4/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //h4/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[1]/div/div[2]/ul[1]/li
        type: xpath
    request:
        allowed_hosts:
            - www.gpjda.com
        form:
            searchword: '{{title}}'
        method: POST
        url: https://www.gpjda.com/search.php
    response: html
tier: 2
