defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: http://www.iyinghua.com/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[2]/div[2]/div[4]/div/div/ul
            type: xpath
    request:
        allowed_hosts:
            - www.iyinghua.com
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: http://www.iyinghua.com/
id: yinghua
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: yinghua
origin:
    digest: sha256:8526ddf8336dc3d6f59b448b3692865bd57eb7d4fb2634014293da2f82d0d17c
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/yinghua.json
    version: "1.2"
resolve:
    allowed_hosts:
        - www.iyinghua.com
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: http://www.iyinghua.com/
    fields:
        subject_key:
            attribute: href
            expression: //h2/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //h2/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //h2/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[4]/div[2]/div/ul/li
        type: xpath
    request:
        allowed_hosts:
            - www.iyinghua.com
        method: GET
        url: http://www.iyinghua.com/search/{{title}}/
    response: html
tier: 2
