defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.qifun.cc/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //div/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[@id='tagContent']//div
            type: xpath
    request:
        allowed_hosts:
            - www.qifun.cc
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.qifun.cc/
id: qifun
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: qifun
origin:
    digest: sha256:93d3c917e7c8f49863292eb1c5dcf2284656e887e9a5e9d3466e06945596d706
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/qifun.json
    version: "2.1"
resolve:
    allowed_hosts:
        - www.qifun.cc
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.qifun.cc/
    fields:
        subject_key:
            attribute: href
            expression: //a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //h6[@class='title']
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[@class='row gutter-20']
        type: xpath
    request:
        allowed_hosts:
            - www.qifun.cc
        method: GET
        url: https://www.qifun.cc/vodsearch/-------------.html?wd={{title}}
    response: html
tier: 2
