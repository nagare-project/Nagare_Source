defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://fcdm.org.cn/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //article[@class='article-content']/div[@id='video_list_li']
            type: xpath
    request:
        allowed_hosts:
            - fcdm.org.cn
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://fcdm.org.cn/
id: fcdm
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: fcdm
origin:
    digest: sha256:47d202374c8b9494b4dbfb5f4ecdb4d46f3147fbbf1bf3047cfe0a4fd1be5da5
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/fcdm.json
    version: "1.0"
resolve:
    allowed_hosts:
        - fcdm.org.cn
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://fcdm.org.cn/
    fields:
        subject_key:
            attribute: href
            expression: //a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //a/h2
            transforms:
                - trim
            type: xpath
    items:
        expression: //article[@class='u-movie']
        type: xpath
    request:
        allowed_hosts:
            - fcdm.org.cn
        method: GET
        url: https://fcdm.org.cn/u/?wd={{title}}
    response: html
tier: 2
