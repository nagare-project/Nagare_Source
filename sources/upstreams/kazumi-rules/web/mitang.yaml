defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.mitang.tv
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[2]/div[2]/div[1]/div/div[2]/div/ul
            type: xpath
    request:
        allowed_hosts:
            - www.mitang.tv
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.mitang.tv/
id: mitang
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: mitang
origin:
    digest: sha256:82c84e480fdda4d4a68eb65c78ce20024d618032352496b3c8764f292d5d3e43
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/mitang.json
    version: 0.0.2
resolve:
    allowed_hosts:
        - www.mitang.tv
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.mitang.tv
    fields:
        subject_key:
            attribute: href
            expression: //h4/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //h4/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //h4/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[1]/div[2]/div/div/div/div[2]/ul/li/div/div
        type: xpath
    request:
        allowed_hosts:
            - www.mitang.tv
        method: GET
        url: https://www.mitang.tv/mitang-s/?wd={{title}}
    response: html
tier: 2
