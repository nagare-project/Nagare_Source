defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.mengdao.tv/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //*[@id='stab_1_71']/ul/li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[3]/div[2]//div
            type: xpath
    request:
        allowed_hosts:
            - www.mengdao.tv
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.mengdao.tv/
id: mandao
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: mandao
origin:
    digest: sha256:739cc00300ae3688891c83f9653e2e300073f7fa819b69891a2d342f654c8e80
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/mandao.json
    version: "1.3"
resolve:
    allowed_hosts:
        - www.mengdao.tv
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.mengdao.tv/
    fields:
        subject_key:
            attribute: href
            expression: //a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //a/div[2]/p
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[2]/div[3]/ul/li
        type: xpath
    request:
        allowed_hosts:
            - www.mengdao.tv
        form:
            searchword: '{{title}}'
        method: POST
        url: https://www.mengdao.tv/search.php
    response: html
tier: 2
