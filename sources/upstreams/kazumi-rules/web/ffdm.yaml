defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.ffdm.cc/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //ul[contains(@class, 'hl-plays-list')]
            type: xpath
    request:
        allowed_hosts:
            - www.ffdm.cc
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.ffdm.cc/
id: ffdm
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: ffdm
origin:
    digest: sha256:a5c92fed1b2bb36e43b1f2a1fbe99ee0138d23a8a13621b60f9657affba83a9d
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/ffdm.json
    version: "1.0"
resolve:
    allowed_hosts:
        - www.ffdm.cc
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.ffdm.cc/
    fields:
        subject_key:
            attribute: href
            expression: //h3/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //h3/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //h3/a/text()
            transforms:
                - trim
            type: xpath
    items:
        expression: //li[@class='list-item']
        type: xpath
    request:
        allowed_hosts:
            - www.ffdm.cc
        method: GET
        url: https://www.ffdm.cc/search.html?wd={{title}}
    response: html
tier: 2
