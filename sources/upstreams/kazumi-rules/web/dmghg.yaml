defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.dmghg1.com/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[@class='module-play-list-content  module-play-list-larger ']
            type: xpath
    request:
        allowed_hosts:
            - www.dmghg1.com
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.dmghg1.com/
id: dmghg
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: dmghg
origin:
    digest: sha256:d4b8df665a23d96ce62cbd5557b66a145fdebeca1b3746261fe103399595aee7
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/dmghg.json
    version: "1.0"
resolve:
    allowed_hosts:
        - www.dmghg1.com
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.dmghg1.com/
    fields:
        subject_key:
            attribute: href
            expression: //div[@class='module-card-item-footer']/a[2]
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div[@class='module-card-item-footer']/a[2]
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //a/strong
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[@class='module-items module-card-items']//div
        type: xpath
    request:
        allowed_hosts:
            - www.dmghg1.com
        method: GET
        url: https://www.dmghg1.com/index.php/vod/search.html?wd={{title}}
    response: html
tier: 2
