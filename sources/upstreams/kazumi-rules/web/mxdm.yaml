defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: true
episodes:
    base_url: https://www.dcc3.com/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[4]/div/div/ul
            type: xpath
    request:
        allowed_hosts:
            - www.dcc3.com
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.dcc3.com/
id: mxdm
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: MXdm
origin:
    digest: sha256:d68971d390579fdedc4229ce4994e5ae21cf9174b75e1e0047991f9662853d57
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/MXdm.json
    version: "2.3"
resolve:
    allowed_hosts:
        - www.dcc3.com
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.dcc3.com/
    fields:
        subject_key:
            attribute: href
            expression: //h3/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //h3/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //h3/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[3]/ul/li
        type: xpath
    request:
        allowed_hosts:
            - www.dcc3.com
        method: GET
        url: https://www.dcc3.com/search/?wd={{title}}
    response: html
tier: 2
