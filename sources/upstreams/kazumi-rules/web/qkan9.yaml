defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.qkan9.com/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[3]/div/div[2]/div/div[1]/div[2]/div/ul[2]
            type: xpath
    request:
        allowed_hosts:
            - www.qkan9.com
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.qkan9.com/
id: qkan9
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: qkan9
origin:
    digest: sha256:f3e0b3148cf427c4d8ad4b179215219e3e4052b8b1e7c3b896ca2f94195ce2b5
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/qkan9.json
    version: "1.0"
resolve:
    allowed_hosts:
        - www.qkan9.com
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.qkan9.com/
    fields:
        subject_key:
            attribute: href
            expression: //dt/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //dt/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //dd/h1/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[3]/div/div/dl
        type: xpath
    request:
        allowed_hosts:
            - www.qkan9.com
        method: GET
        url: https://www.qkan9.com/index.php/vod/search.html?wd={{title}}
    response: html
tier: 2
