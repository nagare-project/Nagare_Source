defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.moefan.cc/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //div/div/ul/li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[2]/div[2]/div/div/div[2]/div/div[1]/div[2]//div
            type: xpath
    request:
        allowed_hosts:
            - www.moefan.cc
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.moefan.cc/
id: moefan
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: moefan
origin:
    digest: sha256:6cf2a5e91a0cf74c1ea66919f73d8cde5b178d1a66be90638f60747579530800
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/moefan.json
    version: "1.0"
resolve:
    allowed_hosts:
        - www.moefan.cc
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.moefan.cc/
    fields:
        subject_key:
            attribute: href
            expression: //div/div/div[2]/div[2]/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div/div/div[2]/div[2]/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div/div/div[2]/div[1]/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div/div[2]/div/div[2]/div/div/div[1]/div/div[2]/div/ul//li
        type: xpath
    request:
        allowed_hosts:
            - www.moefan.cc
        method: GET
        url: https://www.moefan.cc/index.php/vod/search.html?wd={{title}}
    response: html
tier: 2
