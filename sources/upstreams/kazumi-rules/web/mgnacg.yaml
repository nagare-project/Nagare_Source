defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.mgnacg.com
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //li/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //ul[@class='anthology-list-play size']
            type: xpath
    request:
        allowed_hosts:
            - www.mgnacg.com
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.mgnacg.com/
id: mgnacg
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: mgnacg
origin:
    digest: sha256:7e2722ded04430cb488649e91ec63cc42f59e5ba04fad148085b00159cc1f182
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/mgnacg.json
    version: "1.0"
resolve:
    allowed_hosts:
        - www.mgnacg.com
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.mgnacg.com
    fields:
        subject_key:
            attribute: href
            expression: //div/div[2]/a[1]
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div/div[2]/a[1]
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div/div[1]/div
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[@class='public-list-box search-box flex rel']
        type: xpath
    request:
        allowed_hosts:
            - www.mgnacg.com
        method: GET
        url: https://www.mgnacg.com/search/-------------/?wd={{title}}
    response: html
tier: 2
