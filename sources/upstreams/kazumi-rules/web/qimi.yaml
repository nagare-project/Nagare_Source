defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.qimiqimi.net/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div[@class='video_list fn-clear']
            type: xpath
    request:
        allowed_hosts:
            - www.qimiqimi.net
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.qimiqimi.net/
id: qimi
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: qimi
origin:
    digest: sha256:de56536cb827ca724fe98f669033a3ede150bd6b6c2a7a7b34c0058db5b65f78
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/qimi.json
    version: "1.2"
resolve:
    allowed_hosts:
        - www.qimiqimi.net
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.qimiqimi.net/
    fields:
        subject_key:
            attribute: href
            expression: //div/h2/a
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div/h2/a
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div/h2/a
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[5]/ul/li
        type: xpath
    request:
        allowed_hosts:
            - www.qimiqimi.net
        method: GET
        url: https://www.qimiqimi.net/index.php/vod/search.html?wd={{title}}
    response: html
tier: 2
