defaults:
    resolution: 1080P
    subtitle_languages: []
enabled: false
episodes:
    base_url: https://www.jcydm1.com/
    lines:
        episodes:
            fields:
                number:
                    any:
                        - expression: .
                          required: false
                          transforms:
                            - trim
                            - parse_episode
                          type: xpath
                        - expression: '{{episode_number}}'
                          transforms:
                            - parse_episode
                          type: template
                    required: true
                play_url:
                    attribute: href
                    expression: .
                    transforms:
                        - trim
                        - absolute_url
                    type: xpath
                title:
                    expression: .
                    transforms:
                        - trim
                    type: xpath
            items:
                expression: //div/div/a
                type: xpath
        fields:
            channel:
                expression: 播放线路{{line_number}}
                type: template
        items:
            expression: //div/div[2]/div/div[2]/div[@id='panel1']
            type: xpath
    request:
        allowed_hosts:
            - www.jcydm1.com
        method: GET
        url: '{{subject_url}}'
    response: html
homepage: https://www.jcydm1.com/
id: 9ciyuan
kind: web
limits:
    concurrency: 1
    max_redirects: 3
    max_response_bytes: 5242880
    requests_per_minute: 20
    timeout_ms: 15000
matching:
    distinguish_channel: true
    distinguish_subject: true
    require_episode: true
    require_subject: true
name: 9ciyuan
origin:
    digest: sha256:9693cac4d99c0c43cf16ff2bc319c67364de3f25c0c2f37e95b8306f79338a98
    ecosystem: kazumi
    license: MIT
    upstream: https://github.com/Predidit/KazumiRules/blob/5fea5eb84768a2290ddedb156583ef20d9b43561/9ciyuan.json
    version: "1.3"
resolve:
    allowed_hosts:
        - www.jcydm1.com
    cookie_policy: source
    match:
        include:
            - (?i)(?:https?://[^\s"']+\.(?:m3u8|mp4|mkv)(?:[?#][^\s"']*)?|https?://[^\s"']*(?:akamaized|bilivideo\.com)[^\s"']*)
    mode: browser_sniff
    timeout_ms: 15000
    transport: auto
    url: '{{play_url}}'
schema: nagare-source/v1
search:
    base_url: https://www.jcydm1.com/
    fields:
        subject_key:
            attribute: href
            expression: //div[3]/a[2]
            transforms:
                - trim
            type: xpath
        subject_url:
            attribute: href
            expression: //div[3]/a[2]
            transforms:
                - trim
                - absolute_url
            type: xpath
        title:
            expression: //div[2]/div[1]/a/strong
            transforms:
                - trim
            type: xpath
    items:
        expression: //div[1]/div[2]/div/div/div[2]/div[1]//div
        type: xpath
    request:
        allowed_hosts:
            - www.jcydm1.com
        method: GET
        url: https://www.jcydm1.com/index.php/vod/search.html?wd={{title}}
    response: html
tier: 2
