name: source health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/health.yml"
      - "cmd/**"
      - "internal/**"
      - "reports/**"
      - "schema/**"
      - "sources/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: source-health-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate network health report and static page
        run: >-
          go run ./cmd/nagare-source health
          --mode network
          --concurrency 6
          --out _site/health.json
          --html _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy health page
        id: deployment
        uses: actions/deploy-pages@v5
